name: Adagio Therapeutics
description: 'Adagio Therapeutics is a clinical-stage biopharmaceutical company founded in 2020 to discover,
  develop, and commercialize antibody-based therapies for serious infectious diseases, with an initial
  focus on SARS-CoV-2 and other respiratory viruses. Its lead programs centered on monoclonal antibody
  candidates engineered for high potency and broad, evolution-resistant neutralization. The company was
  renamed Invivyd, Inc. in 2023 (Nasdaq: IVVD) and now advances antibody medicines such as PEMGARDA and
  the VYD2311 candidate. It was surfaced as a portfolio company of GV (Google Ventures) and added to the
  API Evangelist network. As a life-sciences therapeutics company it publishes no public developer API,
  SDK, or documentation surface; this profile captures corporate identity and policy links only.'
